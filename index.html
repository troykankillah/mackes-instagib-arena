<!doctype html>
<html lang="sv">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mackes Instagib Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow+Condensed:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: full-bleed WebGL arena; HUD pinned to the corners like a CPMA hud; menu is a left-docked panel over a live bot match. Single dusk-forest look. */
:root {
  --night: #120f14;
  --panel: rgba(18, 15, 20, 0.82);
  --ink: #f4ead8;
  --dim: #b7a991;
  --sq: #ff7a2f;
  --hh: #4fd6c8;
  --gold: #ffd23f;
  --line: rgba(244, 234, 216, 0.16);
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-body: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-mono: "Share Tech Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); font-family: var(--f-body); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--f-mono); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
#score { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; font-family: var(--f-display); font-size: 26px; }
#score .sq { color: var(--sq); }
#score .hh { color: var(--hh); }
#score .lim { font-family: var(--f-mono); font-size: 13px; color: var(--dim); letter-spacing: .08em; }
#feed { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; font-size: 15px; }
#feed div { background: rgba(0,0,0,.35); padding: 2px 8px; }
#feed .bolt { color: var(--gold); margin: 0 6px; }
#announce { position: absolute; top: 24%; left: 50%; transform: translateX(-50%); font-family: var(--f-display); font-size: clamp(20px, 2.8vw, 32px); color: var(--ink); text-align: center; white-space: nowrap; opacity: 0; transition: opacity .25s; }
#announce small { display: block; font-family: var(--f-mono); font-size: 15px; color: var(--ink); letter-spacing: .1em; }
#cross { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; transform: translate(-50%, -50%); }
#cross svg { width: 100%; height: 100%; overflow: visible; }
#cross.hit svg { transform: scale(1.35); filter: drop-shadow(0 0 6px #fff); }
#cross svg { transition: transform .12s, filter .12s; }
#hitflash { position: absolute; inset: 0; background: radial-gradient(circle, transparent 55%, rgba(255,90,40,.35)); opacity: 0; }
#speed { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-size: 30px; text-align: center; font-variant-numeric: tabular-nums; }
#fps { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
#lockwarn { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); background: rgba(0,0,0,.6); color: var(--gold); padding: 8px 14px; font-size: 16px; text-align: center; max-width: calc(100vw - 32px); }
#speed small { display: block; font-size: 11px; color: var(--dim); letter-spacing: .2em; }
#rate { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 6px; }
#rate .lbl { font-size: 11px; letter-spacing: .2em; color: var(--dim); }
#pips { display: flex; gap: 3px; align-items: flex-end; }
#pips i { width: 9px; background: rgba(244,234,216,.18); display: block; }
#pips i.on { background: var(--team, var(--sq)); box-shadow: 0 0 8px var(--team, var(--sq)); }
#rateval { font-size: 22px; font-variant-numeric: tabular-nums; }
#rateval b { color: var(--team, var(--sq)); font-weight: normal; }
#powers { position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 6px; align-items: flex-end; font-size: 18px; }
#powers div { padding: 3px 10px; border: 1px solid currentColor; background: rgba(0,0,0,.35); }
#death { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); text-align: center; font-size: 18px; }
#death b { font-family: var(--f-display); font-weight: normal; font-size: 30px; display: block; }
#board { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: var(--panel); padding: 18px 22px; min-width: min(560px, calc(100vw - 32px)); font-size: 16px; }
#board table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
#board th { text-align: left; font-weight: normal; color: var(--dim); font-size: 12px; letter-spacing: .15em; padding: 4px 6px; }
#board td { padding: 3px 6px; border-top: 1px solid var(--line); }
#board td.n { text-align: right; }
#board th.n { text-align: right; }

/* ---------- Menu ---------- */
#menu { position: fixed; inset: 0; display: flex; justify-content: center; align-items: stretch; padding-inline: 16px; overflow-y: auto; background: radial-gradient(ellipse at 50% 55%, rgba(10,8,12,.55) 0%, rgba(10,8,12,.86) 70%); }
#menu .panel { width: min(900px, 100%); padding-block: calc(28px + env(safe-area-inset-top, 0px)) 28px; display: flex; flex-direction: column; align-items: center; gap: 22px; margin-block: auto; text-align: center; }
#opts { max-width: 520px; text-align: left !important; align-items: stretch !important; }
h1 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: clamp(40px, 8.5vw, 92px); line-height: .9; display: flex; flex-direction: column; align-items: center; text-wrap: balance; text-shadow: 0 4px 0 rgba(0,0,0,.45); }
h1 .eyebrow { font-family: var(--f-mono); font-size: clamp(14px, 1.6vw, 20px); letter-spacing: .5em; color: var(--gold); margin-bottom: 6px; padding-left: .5em; }
h1 .big { background: linear-gradient(90deg, var(--sq), var(--gold) 30%, var(--hh) 55%, #8fe36b 75%, #ff4f9a); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 .t-sq { color: var(--sq); }
h1 .t-hh { color: var(--hh); }
h1 .vs { font-family: var(--f-mono); font-size: 18px; color: var(--dim); letter-spacing: .3em; margin: 6px 0 4px 4px; }
.tag { margin: 0; font-size: 20px; line-height: 1.3; max-width: 34ch; }
.tag b { color: var(--gold); font-weight: 600; }
#result { margin: 0; font-family: var(--f-display); font-size: 26px; }
.chars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; width: 100%; }
@media (max-width: 620px) { .chars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.char { all: unset; cursor: pointer; padding: 10px 8px 14px; border: 2px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(0,0,0,.45)); display: grid; gap: 8px; justify-items: center; transition: transform .15s, border-color .15s, box-shadow .15s; }
.char:hover { transform: translateY(-3px); }
.char[aria-checked="true"] { transform: translateY(-6px); box-shadow: 0 10px 30px -8px var(--c); }
.char canvas { width: 100%; max-width: 200px; aspect-ratio: 3 / 4; display: block; }
.char b { font-family: var(--f-display); font-weight: normal; font-size: clamp(15px, 1.8vw, 20px); color: var(--c); }
.actions { justify-content: center; }
.mp { justify-content: center; }
.char[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, rgba(0,0,0,.35)); }
.char:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.mp { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn.small { font-size: 15px; padding: 7px 14px; }
#mp-code { width: 5ch; background: rgba(0,0,0,.4); color: var(--ink); border: 2px solid var(--line); padding: 6px 8px; font-family: var(--f-mono); font-size: 18px; text-transform: uppercase; letter-spacing: .15em; }
#mp-status { font-family: var(--f-mono); font-size: 16px; color: var(--gold); }
#online { margin: 0; font-family: var(--f-mono); font-size: 14px; color: var(--dim); min-height: 1.2em; }
#opts h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 30px; }
.settings input[type=text] { grid-column: span 2; background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid var(--line); padding: 4px 6px; font: inherit; min-width: 0; }
#score .me { color: var(--team, var(--sq)); }
#score .lead { font-family: var(--f-mono); font-size: 15px; }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.settings { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; font-size: 17px; }
.settings label { color: var(--dim); }
.settings output { font-family: var(--f-mono); min-width: 3ch; text-align: right; }
.settings select { grid-column: span 2; background: rgba(0,0,0,.4); color: var(--ink); border: 1px solid var(--line); padding: 4px 6px; font: inherit; }
.settings input[type=range] { accent-color: var(--gold); width: 100%; min-width: 0; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; font-family: var(--f-display); font-size: 22px; padding: 10px 26px; background: var(--gold); color: #1a1208; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.legend { display: grid; gap: 10px; font-size: 16px; line-height: 1.35; border-top: 1px solid var(--line); padding-top: 14px; }
.legend h2 { margin: 0; font-size: 12px; letter-spacing: .2em; font-weight: 600; color: var(--dim); text-transform: uppercase; }
.pu { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: baseline; }
.pu i { width: 10px; height: 10px; display: block; transform: rotate(45deg); }
.keys { font-family: var(--f-mono); font-size: 14px; color: var(--dim); }
.keys kbd { font-family: inherit; color: var(--ink); border: 1px solid var(--line); padding: 0 5px; }
.lock-note { margin: 0; color: var(--gold); font-size: 17px; border-left: 3px solid var(--gold); padding-left: 10px; }
.touch-note { display: none; margin: 0; color: var(--gold); font-size: 17px; }
@media (hover: none) and (pointer: coarse) { .touch-note { display: block; } }
@media (max-width: 640px) { #menu { background: rgba(10,8,12,.78); } }
@media (prefers-reduced-motion: reduce) { #announce { transition: none; } }
</style>

<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="hitflash"></div>
  <div id="score"><span class="me" id="s-me">0</span><span class="lim" id="s-lim">/ 25</span><span class="lead" id="s-lead"></span></div>
  <div id="feed"></div>
  <div id="announce"></div>
  <div id="cross">
    <svg viewBox="-20 -20 40 40" aria-hidden="true">
      <circle r="13" fill="none" stroke="rgba(244,234,216,.25)" stroke-width="2"></circle>
      <circle id="ring" r="13" fill="none" stroke="#ff7a2f" stroke-width="2.5" stroke-dasharray="81.7" stroke-dashoffset="0" transform="rotate(-90)"></circle>
      <circle r="1.6" fill="#fff" stroke="#000" stroke-width=".8"></circle>
    </svg>
  </div>
  <div id="speed">0<small>UPS</small></div>
  <div id="fps"></div>
  <div id="lockwarn" hidden>Klicka i spelet för att låsa musen.</div>
  <div id="rate">
    <div class="lbl">ELDHASTIGHET</div>
    <div id="pips"></div>
    <div id="rateval"><b>NIVÅ 0</b> · 1.50 s</div>
  </div>
  <div id="powers"></div>
  <div id="death" hidden></div>
  <div id="board" hidden></div>
</div>

<div id="menu">
  <div class="panel" id="main">
    <h1><span class="eyebrow">MACKES</span><span class="big">Instagib Arena</span></h1>
    <p id="result" hidden></p>
    <div class="chars" role="radiogroup" aria-label="Figur" id="chars"></div>
    <div class="actions">
      <button class="btn ghost" id="resume" hidden>Fortsätt</button>
      <button class="btn" id="start">Spela</button>
      <button class="btn ghost" id="open-opts">Inställningar</button>
    </div>
    <div id="mp" class="mp" hidden>
      <button class="btn ghost small" id="mp-host">Skapa rum</button>
      <input type="text" id="mp-code" maxlength="4" placeholder="KOD" autocomplete="off" spellcheck="false" aria-label="Rumskod">
      <button class="btn ghost small" id="mp-join">Gå med</button>
      <span id="mp-status"></span>
      <button class="btn ghost small" id="mp-copy" hidden>Kopiera</button>
    </div>
    <p id="online"></p>
    <p id="locknote" class="lock-note" hidden></p>
  </div>
  <div class="panel" id="opts" hidden>
    <h2>Inställningar</h2>
    <div class="settings">
      <label for="nick">Namn</label><input type="text" id="nick" maxlength="16" autocomplete="off" spellcheck="false"><output></output>
      <label for="bots">Bottar</label><input type="range" id="bots" min="0" max="7" step="1" value="5"><output id="bots-o">5</output>
      <label for="diff">Svårighet</label><select id="diff"><option value="easy">Lätt</option><option value="normal" selected>Normal</option><option value="hard">Svår</option></select>
      <label for="limit">Fraggräns</label><select id="limit"><option value="15">15</option><option value="25">25</option><option value="50">50</option><option value="100" selected>100</option><option value="0">Obegränsad</option></select>
      <label for="sens">Känslighet</label><input type="range" id="sens" min="0.5" max="10" step="0.1" value="3"><output id="sens-o">3.0</output>
      <label for="fov">FOV</label><input type="range" id="fov" min="80" max="140" step="1" value="125"><output id="fov-o">125</output>
      <label for="move">Rörelse</label><select id="move"><option value="plus">CPMA+</option><option value="cpma">CPMA</option></select>
      <label for="jumpkey">Hoppa</label><select id="jumpkey"><option value="m2">Mus2 (zoom på Space)</option><option value="space">Space (zoom på Mus2)</option></select>
      <label for="zoom">Zoom-FOV</label><input type="range" id="zoom" min="40" max="100" step="1" value="70"><output id="zoom-o">70</output>
      <label for="boxes">Visa hitboxar</label><input type="checkbox" id="boxes"><output></output>
      <label for="map">Bana</label><select id="map"></select>
      <label for="full">Helskärm</label><input type="checkbox" id="full" checked><output></output>
    </div>
    <div class="actions"><button class="btn" id="close-opts">Klar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const T = THREE;
const $ = s => document.querySelector(s);

// ================= Constants (Quake units) =================
const TICK = 1 / 125;
const GRAV = 800, JUMP = 270, DJUMP = 100;
const ACC_GROUND = 15, ACC_AIRSTOP = 2.5;
// Air tuning. "cpma" is stock CPMA (promode); "plus" keeps the same rules with more grip in the air.
const MOVES = {
  cpma: { air: 1,   strafe: 70,  strafeWish: 30, control: 150 },
  plus: { air: 1.6, strafe: 110, strafeWish: 45, control: 230 },
};
let ACC_AIR = 1, ACC_STRAFE = 70, WISH_STRAFE = 30, AIRCONTROL = 150;
function applyMove(name) { const m = MOVES[name] || MOVES.plus; ACC_AIR = m.air; ACC_STRAFE = m.strafe; WISH_STRAFE = m.strafeWish; AIRCONTROL = m.control; }
const FRICTION = 8, STOPSPEED = 100, MAXSPEED = 320;
const HALF = 15, HEIGHT = 56, EYE = 48, STEP = 18, EPS = 0.01;
const HIT_HALF = 16, HIT_TOP = 58; // Q3 player box is 30x30x56; one unit of slack each side
const CROUCH_H = 40, CROUCH_EYE = 30, CROUCH_SPEED = 0.33; // Q3 ducked box and walk scale
const hOf = e => e.crouch ? CROUCH_H : HEIGHT;
const eyeOf = e => e.crouch ? CROUCH_EYE : EYE;
// No ceiling: every frag speeds the laser up until it fires every physics tick. MAX_LVL is only the pip count.
const RATE_BASE = 1.5, RATE_MUL = 0.8, RATE_MIN = 1 / 125, MAX_LVL = 12;
const fireInterval = l => Math.max(RATE_MIN, RATE_BASE * Math.pow(RATE_MUL, l));

// Free-for-all: `team` on an entity is just which character it plays.
const TEAMS = {
  sq: { name: 'Ekorre',     color: 0xff7a2f, css: '#ff7a2f', pitch: 1 },
  hh: { name: 'Igelkott',   color: 0x4fd6c8, css: '#4fd6c8', pitch: 1.3 },
  tt: { name: 'Sköldpadda', color: 0x8fe36b, css: '#8fe36b', pitch: 0.8 },
  mn: { name: 'DaQuan',     color: 0xff4f9a, css: '#ff4f9a', pitch: 1.15 },
};
const CHAR_KEYS = ['sq', 'hh', 'tt', 'mn'];
const BOT_NAMES = ['Nötta', 'Kotte', 'Svansen', 'Taggis', 'Igge', 'Kulan', 'Skalle', 'Snigel', 'Bas', 'Ruff', 'Pricken', 'Rullan', 'Gnistan', 'Moss'];
const DIFF = {
  // track: how fast the aim point catches a moving target (1/s); spread: shot shake (rad);
  // trigger: how eagerly a bot pulls the trigger once it thinks it is on target (1/s)
  // conf: how loosely a bot judges "on target" (x hitbox width) — impatient bots shoot early
  easy:   { react: 0.8,  err: 0.18, settle: 2.0, turn: 4,  hop: 0.5, track: 3.5, spread: 0.24, trigger: 4,  conf: 3.0 },
  normal: { react: 0.55, err: 0.12, settle: 3.0, turn: 6,  hop: 1.0, track: 5.5, spread: 0.10, trigger: 6,  conf: 2.2 },
  hard:   { react: 0.32, err: 0.07, settle: 4.5, turn: 10, hop: 1.8, track: 9,   spread: 0.06, trigger: 10, conf: 1.5 },
};
const PU = {
  invis:  { name: 'Osynlighet', color: 0xb48cff, css: '#b48cff', respawn: 45, dur: 20 },
  shield: { name: 'Skal',       color: 0xe6eef7, css: '#e6eef7', respawn: 25 },
  turbo:  { name: 'Turbo +3',   color: 0xffd23f, css: '#ffd23f', respawn: 30 },
  wide:   { name: 'Bred rail',  color: 0x7ff3ff, css: '#7ff3ff', respawn: 35, dur: 20 },
  missiles: { name: 'Missiler', color: 0xff5a3c, css: '#ff5a3c', respawn: 40, dur: 20 },
};

// ================= Settings =================
const settings = { team: 'sq', bots: 5, diff: 'normal', limit: 100, sens: 3, fov: 125, full: true, move: 'plus', jumpkey: 'm2', zoom: 70, map: 'glade', nick: 'Spelare' + (100 + Math.random() * 900 | 0) };
try { Object.assign(settings, JSON.parse(localStorage.getItem('evi2-settings') || '{}')); } catch (e) {}
if (!TEAMS[settings.team]) settings.team = 'sq';
applyMove(settings.move);
function saveSettings() { try { localStorage.setItem('evi2-settings', JSON.stringify(settings)); } catch (e) {} }

// ================= Maps =================
// Each map fills boxes / pads / powerups / spawns and says how the world around it looks.
const boxes = [], pads = [], powerups = [], spawns = [], extraWps = [];
function B(x1, y1, z1, x2, y2, z2, kind) {
  boxes.push({ min: [Math.min(x1, x2), Math.min(y1, y2), Math.min(z1, z2)], max: [Math.max(x1, x2), Math.max(y1, y2), Math.max(z1, z2)], kind });
}
// A jump pad on top of (x, y, z) that throws you onto the point (tx, ty, tz), peaking `arc` above the higher end.
function pad(x, y, z, tx, ty, tz, arc = 120) {
  B(x - 34, y, z - 34, x + 34, y + 4, z + 34, 'pad');
  const top = Math.max(y, ty) + arc, vy = Math.sqrt(2 * GRAV * (top - y));
  const t = vy / GRAV + Math.sqrt(2 * (top - ty) / GRAV), dx = tx - x, dz = tz - z;
  pads.push({ x, y: y + 4, z, vx: dx / t, vy, vz: dz / t, tx, ty, tz });
}
const W = 1100, WH = 520;
const MAPS = {
  glade: {
    name: 'Gläntan',
    look: 'forest', killY: -500, orbit: 1250, shadow: 1300,
    grid: { x: [-1000, 1000], z: [-1000, 1000], step: 100 },
    build() {
      B(-W - 60, -40, -W - 60, W + 60, 0, W + 60, 'floor');
      B(-W - 60, 0, -W - 60, W + 60, WH, -W, 'wall');
      B(-W - 60, 0, W, W + 60, WH, W + 60, 'wall');
      B(-W - 60, 0, -W, -W, WH, W, 'wall');
      B(W, 0, -W, W + 60, WH, W, 'wall');
      // central plateau with corner posts
      B(-160, 0, -160, 160, 160, 160, 'stone');
      for (const [px, pz] of [[120, 120], [-120, 120], [120, -120], [-120, -120]]) B(px - 22, 160, pz - 22, px + 22, 200, pz + 22, 'stone');
      // corner platforms + stairs (each step gets a waypoint; the grid is too coarse for them)
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
        B(sx * 700, 0, sz * 700, sx * W, 112, sz * W, 'stone');
        for (let k = 1; k <= 6; k++) { const x1 = 700 - 32 * (7 - k); B(sx * x1, 0, sz * 720, sx * (x1 + 32), 16 * k, sz * 930, 'step'); }
        extraWps.push({ x: sx * 500, y: 0, z: sz * 825 });
        for (let k = 1; k <= 6; k++) extraWps.push({ x: sx * (700 - 32 * (7 - k) + 16), y: 16 * k, z: sz * 825 });
        extraWps.push({ x: sx * 740, y: 112, z: sz * 825 });
      }
      for (const sz of [-1, 1]) B(-700, 0, sz * 980, 700, 112, sz * W, 'stone');
      for (const sx of [-1, 1]) B(sx * 600 - 40, 0, -40, sx * 600 + 40, 260, 40, 'stone');
      const crate = (x, z, s, y = 0) => B(x - s / 2, y, z - s / 2, x + s / 2, y + s, z + s / 2, 'crate');
      for (const [x, z] of [[320, 560], [-560, 320], [-320, -560], [560, -320]]) crate(x, z, 64);

function spawnBeam(a, b, team, level, wide = false) {
  const col = new T.Color(TEAMS[team].color);
  const dir = b.clone().sub(a), len = dir.length(); dir.normalize();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const q = new T.Quaternion().setFromUnitVectors(new T.Vector3(0, 1, 0), dir);
  const w = 1; // Q3 look: a hair-thin core and a loose spiral, same at every level
  const cr = wide ? 1.6 : 0.35, gr = wide ? 9 : 1.1;
  const core = new T.Mesh(new T.CylinderGeometry(cr, cr, len, 5, 1, true), new T.MeshBasicMaterial({ color: col.clone().lerp(new T.Color(0xffffff), 0.55), transparent: true, blending: T.AdditiveBlending, depthWrite: false }));

  for (const m of [core, glow]) { m.position.copy(mid); m.quaternion.copy(q); scene.add(m); }
  // spiral
  // at very high fire rates skip most of the spiral so the frame rate survives
  const n = Math.max(0, Math.min(level > 14 ? 120 : 900, Math.floor((len - 20) / 4))), pos = new Float32Array(n * 3);
  const u = new T.Vector3(1, 0, 0); if (Math.abs(dir.x) > 0.9) u.set(0, 1, 0);
  u.cross(dir).normalize(); const v = dir.clone().cross(u).normalize();
  for (let i = 0; i < n; i++) { const t = 20 + i * 4, th = t * 0.3; const p = a.clone().addScaledVector(dir, t).addScaledVector(u, Math.cos(th) * (wide ? 10 : 3.5)).addScaledVector(v, Math.sin(th) * (wide ? 10 : 3.5)); pos.set([p.x, p.y, p.z], i * 3); }
  const sg = new T.BufferGeometry(); sg.setAttribute('position', new T.BufferAttribute(pos, 3));
  const spiral = new T.Points(sg, new T.PointsMaterial({ color: col, size: 1.8, transparent: true, blending: T.AdditiveBlending, depthWrite: false }));
  scene.add(spiral);
  fx.push({ t: 0, life: Math.min(0.9, Math.max(0.1, fireInterval(level) * 5)), update(f, k) { core.material.opacity = 1 - k; glow.material.opacity = 0.22 * (1 - k); spiral.material.opacity = 1 - k; spiral.material.size = 1.8 + k * 2.5; }, dispose() { for (const m of [core, glow, spiral]) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); } } });
}
function spawnBurst(p, color, n = 24, speed = 180, life = 0.6, size = 4) {

}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {

  camera.updateProjectionMatrix();
  vmCam.aspect = w / h; vmCam.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function tick() {
  now += TICK;
  if (player) {
    const inp = player.input;
    inp.f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    inp.s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    inp.jump = settings.jumpkey === 'space' ? !!keys.Space : !!keys.Mouse2;
    inp.crouch = !!(keys.ControlLeft || keys.ControlRight || keys.KeyC);
    inp.fire = fireHeld && state === 'play';
    if (!player.alive && player.respawnT <= 0 && (fireHeld || player.respawnT < -2.5)) { respawn(player); fireHeld = false; player.cooldown = 0.4; }
  }
  for (const e of ents) {
    e.prev.copy(e.pos);
    if (e.remote) {
      // follow the last reported position, extrapolated a little along its velocity
      if (!e.alive) continue;
      const age = Math.min(0.15, (performance.now() - e.netT) / 1000);
      _v1.copy(e.netPos).addScaledVector(e.netVel, age);
      if (e.pos.distanceToSquared(_v1) > 200 * 200) e.pos.copy(_v1); else e.pos.lerp(_v1, 0.35);
      if (e.invis > 0) e.invis -= TICK;
      continue;
    }
    if (!e.alive) { e.respawnT -= TICK; if (e.isBot && e.respawnT <= 0) respawn(e); continue; }
    if (e.isBot) botTick(e, TICK);
    pmove(e, TICK);
    e.cooldown -= TICK;
    if (e.invis > 0) e.invis -= TICK;
    if (e.wide > 0) e.wide -= TICK;
    if (e.missiles > 0) e.missiles -= TICK;
    if (e.input.fire && e.cooldown <= 0) fire(e);
    if (e.pos.y < MAP.killY) kill(e, e);
  }
  updatePowerups(TICK);
  updateMissiles(TICK);
}

let acc = 0, last = performance.now(), orbit = 0;
let camReady = false, viewH = EYE, curFov = 0;
const camPos = new T.Vector3();
let fpsAcc = 0, fpsN = 0;
function frame(t) {
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  const sim = state === 'play' || state === 'menu';
  if (sim) { acc += dt; let n = 0; while (acc >= TICK && n++ < 30) { tick(); acc -= TICK; } }
  else for (const e of ents) if (e.remote) e.prev.copy(e.pos);
  const alpha = sim ? acc / TICK : 1;

  // entity visuals
  for (const e of ents) {
    e.blob.visible = e.alive && e !== player;
    e.hbox.visible = !!settings.boxes && e.alive && e !== player;
    if (!e.alive || e === player) continue;
    e.mesh.position.lerpVectors(e.prev, e.pos, alpha);
    // debug: the exact box the rail is traced against (same numbers as fire())
    if (e.hbox.visible) { e.hbox.position.copy(e.mesh.position); e.hbox.scale.y = e.crouch ? (CROUCH_H + 3) / (HIT_TOP + 1) : 1; }
    e.mesh.rotation.y = e.yaw;
    e.mesh.scale.y = e.crouch ? 0.72 : 1;
    const a = invisAlpha(e);
    const gy = groundTop(e.mesh.position.x, e.mesh.position.z, e.mesh.position.y + 1);
    if (!Number.isFinite(gy)) { e.blob.visible = false; } else e.blob.position.set(e.mesh.position.x, gy + 0.6, e.mesh.position.z);
    e.blob.material.opacity = 0.4 * a * Math.max(0, 1 - (e.mesh.position.y - gy) / 300);
    for (const m of e.mats) { m.opacity = a; m.depthWrite = a > 0.5; }
    e.bubble.visible = e.shield; e.bubble.material.opacity = 0.35 * a; e.bubble.rotation.y += dt * 1.5;
  }
  for (const p of powerups) {
    p.mesh.visible = p.active; p.mesh.rotation.y += dt * 1.8; p.mesh.position.y = p.y + 22 + Math.sin(now * 2.5 + p.x) * 2.5;
    p.ring.material.opacity = p.active ? 0.6 : 0.15;
  }
  if (sim) { updateFx(dt); updateSmoke(dt); const pa = pollen.geometry.attributes.position; for (let i = 0; i < pa.count; i++) { let y = pa.getY(i) + dt * 6; if (y > 460) y = 0; pa.setY(i, y); } pa.needsUpdate = true; }

  // zoom: instant, no scope overlay; mouse speed follows the narrower view
  zoomHeld = state === 'play' && !!player && player.alive && !!(settings.jumpkey === 'space' ? keys.Mouse2 : keys.Space);
  const wantFov = hfovToV(zoomHeld ? Math.min(settings.zoom, settings.fov) : settings.fov);
  if (wantFov !== curFov) { curFov = wantFov; camera.fov = wantFov; camera.updateProjectionMatrix(); }
  zoomSens = zoomHeld ? Math.tan(Math.min(settings.zoom, settings.fov) * Math.PI / 360) / Math.tan(settings.fov * Math.PI / 360) : 1;

  // camera
  if (player && state !== 'menu') {
    if (player.alive) {
      viewH += (eyeOf(player) - viewH) * Math.min(1, dt * 18);
      camPos.lerpVectors(player.prev, player.pos, alpha); camPos.y += viewH;
      camera.position.copy(camPos); camera.rotation.set(player.pitch, player.yaw, 0);
      camReady = true;
    } else {
      camera.position.y += dt * 12;
      if (player.killer && player.killer !== player && player.killer.alive) camera.lookAt(player.killer.mesh.position.x, player.killer.mesh.position.y + 30, player.killer.mesh.position.z);
    }
  } else {
    orbit += dt * 0.08;
    camera.position.set(Math.cos(orbit) * MAP.orbit, MAP.orbitY || 620, Math.sin(orbit) * MAP.orbit);
    camera.lookAt(0, 80, 0);
  }
  listener.pos.copy(camera.position); listener.yaw = camera.rotation.y;

  // viewmodel (hidden while zoomed, like a scope without the black)
  const showVm = player && player.alive && state !== 'menu' && !zoomHeld;
  vm.root.visible = !!showVm;
  if (showVm) {
    const col = TEAMS[player.team].color, iv = fireInterval(player.level), ready = 1 - Math.max(0, player.cooldown) / iv;
    // no recoil: the laser charges up coil by coil and flares when it fires
    vm.flash = Math.max(0, vm.flash - dt * 7);
    vm.kick = Math.max(0, (vm.kick || 0) - dt * 14);
    const sp = Math.hypot(player.vel.x, player.vel.z);
    vm.gun.position.set(Math.sin(now * 9) * Math.min(1, sp / 320) * (player.onGround ? 0.6 : 0.15), Math.sin(now * 18) * 0.08 * ready, vm.kick * 2.2);
    vm.gun.rotation.x = vm.kick * 0.07;
    const flashCol = new T.Color(col).lerp(new T.Color(0xffffff), vm.flash);
    vm.orbM.color.copy(flashCol);
    // small glow in the dish; the shot is a quick brightness flash, not a bigger ball
    vm.orb.scale.setScalar(0.4 + ready * 1.1 + (ready >= 1 ? Math.sin(now * 14) * 0.12 : 0));
    vm.orbM.opacity = 0.55 + 0.45 * Math.max(vm.flash, ready);
    const a = invisAlpha(player);
    vm.coils.forEach((c, i) => {
      const lit = ready >= (i + 1) / 6;
      c.material.color.setHex(0x3a3640); c.material.emissive.copy(flashCol);
      c.material.emissiveIntensity = lit ? 1.1 + vm.flash : 0.06 + 0.5 * Math.max(0, ready * 6 - i);
      c.material.transparent = a < 1; c.material.opacity = Math.max(0.25, a);
    });
    vm.cellM.color.setHex(col); vm.cellM.opacity = (0.3 + 0.7 * ready) * Math.max(0.3, a);
    vm.gun.traverse(o => { if (o.material && !vm.coils.includes(o) && o.material !== vm.cellM) { o.material.transparent = a < 1; o.material.opacity = Math.max(0.25, a); } });
  }

  renderer.clear();
  renderer.render(scene, camera);
  if (showVm) { renderer.clearDepth(); renderer.render(vmScene, vmCam); }
  if (state === 'play') {
    updateHud(dt);
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) { $('#fps').textContent = `${Math.round(fpsN / fpsAcc)} FPS${net.room ? ` · ${net.code ? 'Rum ' + net.code : 'Online'} · ${net.count + 1} spelare` : ''}`; fpsAcc = 0; fpsN = 0; }
    $('#lockwarn').hidden = pointerLocked;
  }
  renderCards(t);
  netSend(dt);
  requestAnimationFrame(frame);
}
newMatch(false);
requestAnimationFrame(frame);
initNet();
</script>
